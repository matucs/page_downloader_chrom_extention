<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webpage Resource Downloader</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-brand">
                <div class="header-logo" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M12 3v12m0 0l4-4m-4 4l-4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div>
                    <h1 class="title">Resource Downloader</h1>
                    <p class="subtitle">Scan, select, and download page assets</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="settingsBtn" class="btn btn-icon-only" title="Settings" aria-label="Settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="2"/>
                        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </button>
                <button id="scanBtn" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                        <path d="M20 20l-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Scan Page
                </button>
            </div>
        </header>

        <div id="statusSection" class="status-section">
            <div id="licenseStatus" class="license-status">
                <span id="licenseStatusText">Loading...</span>
                <button id="upgradeBtn" class="upgrade-btn" style="display: none;">Upgrade to Pro</button>
            </div>
            <div id="statusMessage" class="status-message">
                Click "Scan Page" to find downloadable resources
            </div>
            <div id="progressBar" class="progress-bar" style="display: none;">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div id="controlsSection" class="controls-section" style="display: none;">
            <div class="controls-row">
                <div class="resource-count">
                    <span id="resourceCount" class="count-number">0</span>
                    <span class="count-label">resources found</span>
                </div>
                <div class="selection-controls">
                    <button id="selectAllBtn" class="btn btn-ghost btn-small">Select All</button>
                    <button id="selectNoneBtn" class="btn btn-ghost btn-small">Clear</button>
                </div>
            </div>

            <div id="selectionSection" class="selection-section">
                <div class="selection-header">
                    <span class="selection-title">Categories</span>
                    <span id="selectionHint" class="selection-hint">0 selected</span>
                </div>
                <div id="resourceList" class="resource-list"></div>
            </div>
        </div>

        <div id="downloadSection" class="download-section" style="display: none;">
            <div class="download-controls">
                <button id="downloadSelectedBtn" class="btn btn-success btn-large" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M12 3v12m0 0l4-4m-4 4l-4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Download Selected (<span id="selectedCount">0</span>)
                </button>

                <div id="limitWarning" class="limit-warning" style="display: none;">
                    <div class="warning-icon">!</div>
                    <div class="warning-text">
                        <span id="limitMessage"></span>
                        <button id="upgradeLimitBtn" class="btn-link">Upgrade to Pro</button>
                    </div>
                </div>
            </div>

            <div id="downloadProgress" class="download-progress-card" style="display: none;">
                <div class="download-progress-header">
                    <div class="download-progress-heading">
                        <span id="downloadStatusBadge" class="status-badge status-downloading">Downloading</span>
                        <div id="downloadProgressTitle" class="progress-title">Preparing downloads...</div>
                    </div>
                    <div id="downloadPercent" class="download-percent">0%</div>
                </div>

                <div class="download-progress-bar">
                    <div id="downloadProgressFill" class="download-progress-fill"></div>
                </div>

                <div id="downloadCurrentFile" class="download-current-file">—</div>

                <div class="download-stats">
                    <div class="stat-item stat-success">
                        <span class="stat-value" id="statCompleted">0</span>
                        <span class="stat-label">Done</span>
                    </div>
                    <div class="stat-item stat-failed">
                        <span class="stat-value" id="statFailed">0</span>
                        <span class="stat-label">Failed</span>
                    </div>
                    <div class="stat-item stat-remaining">
                        <span class="stat-value" id="statRemaining">0</span>
                        <span class="stat-label">Remaining</span>
                    </div>
                </div>

                <div id="downloadStatus" class="progress-message">Preparing downloads...</div>

                <div class="download-actions">
                    <button id="pauseDownloadBtn" class="btn btn-control" title="Pause download">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="4" width="4" height="16" rx="1"/>
                            <rect x="14" y="4" width="4" height="16" rx="1"/>
                        </svg>
                        Pause
                    </button>
                    <button id="resumeDownloadBtn" class="btn btn-control btn-control-primary" title="Resume download" style="display: none;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        Resume
                    </button>
                    <button id="cancelDownloadBtn" class="btn btn-control btn-control-danger" title="Cancel download">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                            <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <footer class="footer">
            <small id="downloadLocationInfo">Files save to your default download folder</small>
        </footer>
    </div>

    <script src="browser-compatibility.js"></script>
    <script src="license.js"></script>
    <script src="popup.js"></script>
</body>

</html>
